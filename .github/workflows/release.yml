name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r mac/requirements.txt
      - name: Build DMG
        run: |
          cd mac
          chmod +x build_dmg.sh
          ./build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage-macOS
          path: mac/dist/ClaudeUsage.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r windows/requirements.txt
      - name: Build EXE
        run: |
          cd windows
          pyinstaller --name "ClaudeUsage" --windowed --noconfirm --add-data "../core.py;." --paths .. claude_usage_win.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage-Windows
          path: windows/dist/ClaudeUsage/

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Zip Windows build
        run: |
          cd ClaudeUsage-Windows
          zip -r ../ClaudeUsage-Windows.zip .
          cd ..
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClaudeUsage-macOS/ClaudeUsage.dmg
            ClaudeUsage-Windows.zip
