name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: "*.dmg"
            name: ClaudeUsage-macOS
          - os: windows-latest
            artifact: "*.exe"
            name: ClaudeUsage-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install WiX (Windows, needed by jpackage for .exe)
        if: matrix.os == 'windows-latest'
        run: choco install wixtoolset -y
        shell: powershell
      - name: Build installer
        working-directory: java
        shell: bash
        run: |
          chmod +x build_installer.sh || true
          bash build_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: java/installer/${{ matrix.artifact }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClaudeUsage-macOS/*
            ClaudeUsage-Windows/*
